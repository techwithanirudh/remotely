# Paired with .swiftformat: anything about wrapping and whitespace is settled
# there, and anything about safety and naming is settled here. Where the two
# could disagree, the rule is disabled on this side.

included:
  - Sources
  - Tests

analyzer_rules:
  - unused_import
  - unused_declaration

disabled_rules:
  - todo                    # TODOs are tracked in the issue list, not the linter
  - trailing_whitespace     # SwiftFormat strips it
  - opening_brace           # SwiftFormat owns brace placement
  - modifier_order          # SwiftFormat's modifierOrder disagrees on nonisolated

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - fatal_error_message
  - empty_count
  - empty_string
  - collection_alignment
  - closure_end_indentation
  - closure_spacing
  - convenience_type
  - discouraged_object_literal
  - first_where
  - last_where
  - contains_over_first_not_nil
  - joined_default_parameter
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_imports
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - yoda_condition

  # Correctness rather than style: each of these stands for a bug that has
  # shipped in somebody's app.
  - discarded_notification_center_observer
  - unowned_variable_capture
  - weak_delegate
  - unhandled_throwing_task
  - identical_operands
  - variable_shadowing
  - return_value_from_void_function
  - optional_enum_case_matching
  - untyped_error_in_catch
  - empty_collection_literal
  - superfluous_else
  - prohibited_super_call
  - private_swiftui_state
  - unneeded_throws_rethrows
  - discouraged_assert
  - explicit_init
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_range_nil_comparison
  - flatmap_over_map_reduce
  - reduce_into
  - sorted_first_last

custom_rules:
  scheduled_timer:
    name: "Scheduled Timer"
    regex: 'Timer\s*\.\s*scheduledTimer'
    message: "Use Timer(timeInterval:) with RunLoop.main.add(timer, forMode: .common). A scheduled timer stops firing while a menu is tracking."
    severity: error

  blocking_sleep:
    name: "Blocking Sleep"
    regex: '(?<![\w.])(?:Thread\.sleep|usleep)\s*\('
    message: "A blocking sleep freezes the UI. Use Task.sleep or a timer."
    severity: error

  print_in_production:
    name: "print() in Production Code"
    regex: '(?<![\w."])(?:print|debugPrint|dump)\s*\('
    match_kinds: [identifier]
    # main.swift is the --diagnose CLI path, where stdout is the point.
    excluded: ".*/(Tests|scripts)/.*|.*/main\\.swift"
    message: "print() is invisible in a shipped app. Use the event log."
    severity: warning

line_length:
  warning: 100
  error: 130
  ignores_urls: true
  ignores_comments: false

identifier_name:
  excluded: [id, at, lg, x, y, dx, dy, up]

type_name:
  excluded: [ID]

trailing_comma:
  mandatory_comma: true

nesting:
  type_level: 2
