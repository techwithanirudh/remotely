# Paired with .swiftformat: anything about wrapping and whitespace is settled
# there, and anything about safety and naming is settled here. Where the two
# could disagree, the rule is disabled on this side.

included:
  - Sources

analyzer_rules:
  - unused_import

disabled_rules:
  - todo                    # TODOs are tracked in the issue list, not the linter
  - trailing_whitespace     # SwiftFormat strips it
  - opening_brace           # SwiftFormat owns brace placement

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - fatal_error_message
  - empty_count
  - empty_string
  - collection_alignment
  - closure_end_indentation
  - closure_spacing
  - convenience_type
  - discouraged_object_literal
  - first_where
  - last_where
  - contains_over_first_not_nil
  - joined_default_parameter
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_imports
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - yoda_condition

line_length:
  warning: 100
  error: 130
  ignores_urls: true
  ignores_comments: false

identifier_name:
  excluded: [id, x, y, dx, dy, up]

type_name:
  excluded: [ID]

trailing_comma:
  mandatory_comma: true

nesting:
  type_level: 2
