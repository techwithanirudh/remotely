name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-

      - run: swift build
      - run: swift run RemoteKitTests

      - name: Lint
        run: |
          brew install swiftlint swiftformat
          zsh scripts/lint.sh --check

  analyze:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint
      # Needs a clean build, so it runs on its own rather than in the hook.
      - run: zsh scripts/analyze.sh
