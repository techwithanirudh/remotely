name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SWIFTLINT: 0.65.0
  SWIFTFORMAT: 0.62.1

jobs:
  # Cheap gate on a Linux runner. The macOS jobs still run so required checks
  # stay satisfiable; they no-op when nothing they care about changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Detect code-related paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            range="origin/${{ github.base_ref }}...HEAD"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
              echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            range="${before}...${{ github.sha }}"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          patterns='(\.swift$|(^|/)Package\.(swift|resolved)$|^\.swiftlint|^\.swiftformat|^scripts/|^\.github/workflows/ci\.yml$)'
          if git diff --name-only "$range" | grep -E "$patterns" >/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - name: Skip (no code changes)
        if: needs.changes.outputs.code != 'true'
        run: echo "No code-related paths changed."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.outputs.code == 'true'

      # safeAreaBar and scrollEdgeEffectStyle only exist in the macOS 26 SDK,
      # and `#available` cannot conjure a symbol the SDK does not have.
      - run: sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
        if: needs.changes.outputs.code == 'true'
        continue-on-error: true

      - name: Cache SwiftPM
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - run: swift build -Xswiftc -warnings-as-errors
        if: needs.changes.outputs.code == 'true'
      - run: swift run RemotelyKitTests
        if: needs.changes.outputs.code == 'true'

  format:
    needs: changes
    runs-on: macos-26
    steps:
      - name: Skip (no code changes)
        if: needs.changes.outputs.code != 'true'
        run: echo "No code-related paths changed."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.outputs.code == 'true'

      # A release binary rather than `brew install`: SwiftFormat has no
      # versioned formula, so an unpinned install turns an upstream rule change
      # into a red build here for reasons unrelated to the commit.
      - name: Install SwiftFormat
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT/swiftformat.zip"
          unzip -qo swiftformat.zip -d /usr/local/bin
          chmod +x /usr/local/bin/swiftformat
          swiftformat --version

      - run: swiftformat --lint .
        if: needs.changes.outputs.code == 'true'

  # SwiftLint needs no Xcode for its non-analyzer rules, and a Linux runner is
  # a tenth the cost of a macOS one. The image is pinned by digest as well as
  # tag, so a re-pushed tag cannot change what runs.
  swiftlint:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no code changes)
        if: needs.changes.outputs.code != 'true'
        run: echo "No code-related paths changed."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.outputs.code == 'true'

      - name: Run SwiftLint
        if: needs.changes.outputs.code == 'true'
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/realm/swiftlint:0.65.0@sha256:a482729f4b58741875af1566f23397f3f6db300372756fc31606d0a4527fab9e \
            swiftlint lint --strict

  analyze:
    needs: changes
    runs-on: macos-26
    steps:
      - name: Skip (no code changes)
        if: needs.changes.outputs.code != 'true'
        run: echo "No code-related paths changed."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.outputs.code == 'true'

      - run: sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
        if: needs.changes.outputs.code == 'true'
        continue-on-error: true

      - name: Install SwiftLint
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT/portable_swiftlint.zip"
          unzip -qo swiftlint.zip -d /usr/local/bin
          chmod +x /usr/local/bin/swiftlint

      # Needs a clean build, so it stays out of the hook and off the fast path.
      - run: zsh scripts/analyze.sh
        if: needs.changes.outputs.code == 'true'
